<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="page/logo_mark.png">

  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 24px;
      text-align: center;
    }
    .nf-code {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(80px, 18vw, 180px);
      line-height: 1;
      color: rgba(255,255,255,0.85);
    }
    .nf-msg {
      font-size: 13px;
      letter-spacing: 0.32em;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
    }
    .nf-link {
      margin-top: 12px;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.5);
      padding: 0 2px 6px;
      color: #fff;
    }
    .nf-link:hover { border-color: #fff; }
  </style>
</head>

  <main class="nf-wrap">
    <div class="nf-code">404</div>
